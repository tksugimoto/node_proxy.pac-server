<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<title>PAC URL Switcher</title>
	<style>
		body {
			width: 360px;
			margin: 12px;
			font-family: sans-serif;
			font-size: 13px;
		}
		label {
			display: block;
			margin-bottom: 4px;
			font-weight: bold;
		}
		input[type="url"] {
			box-sizing: border-box;
			width: 100%;
			padding: 4px;
		}
		.buttons {
			display: flex;
			gap: 8px;
			margin-top: 8px;
		}
		.buttons button {
			flex: 1;
		}
		#status {
			margin-top: 12px;
			padding: 6px;
			background: #f0f0f0;
			word-break: break-all;
			white-space: pre-wrap;
		}
		#message:empty {
			display: none;
		}
		#message {
			margin-top: 8px;
			color: #c00;
		}
	</style>
</head>
<body>
	<form id="form">
		<label for="pac-url">PAC URL</label>
		<input type="url" id="pac-url" placeholder="http://127.0.0.1:1024/" required>
		<div class="buttons">
			<button type="submit">適用</button>
			<button type="button" id="clear">解除 (システム設定)</button>
		</div>
	</form>
	<div id="message"></div>
	<div id="status"></div>
	<script src="popup.js"></script>
</body>
</html>
